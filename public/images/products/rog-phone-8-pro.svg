<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 750" fill="none">
  <defs>
    <!-- ROG Phantom Black Gradients -->
    <linearGradient id="rog-frame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <linearGradient id="rog-back" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1D24"/>
      <stop offset="50%" stop-color="#12141A"/>
      <stop offset="100%" stop-color="#0A0B0E"/>
    </linearGradient>

    <radialGradient id="rog-lens" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.3"/>
      <stop offset="40%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>

    <filter id="rog-shadow" x="-15%" y="-10%" width="130%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="26" stdDeviation="22" flood-color="#000000" flood-opacity="0.75"/>
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#10B981" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#rog-shadow)">
    <!-- AirTrigger Ultrasonic Sensor zones -->
    <rect x="74" y="110" width="4" height="65" rx="2" fill="#10B981" />
    <rect x="74" y="570" width="4" height="65" rx="2" fill="#10B981" />

    <!-- Right Buttons -->
    <rect x="422" y="240" width="5" height="100" rx="2.5" fill="#334155" />
    <rect x="422" y="360" width="5" height="50" rx="2.5" fill="#EF4444" />

    <!-- Main Chassis -->
    <rect x="78" y="44" width="344" height="662" rx="36" fill="url(#rog-frame)" stroke="#475569" stroke-width="1.5"/>
    <rect x="81" y="47" width="338" height="656" rx="33" fill="url(#rog-back)"/>

    <!-- Diagonal Cyber Cut Line -->
    <line x1="81" y1="280" x2="419" y2="460" stroke="#334155" stroke-width="1.2" stroke-dasharray="4 6" opacity="0.6"/>

    <!-- ROG Cyber Text Accents -->
    <text x="110" y="330" font-family="'Space Grotesk', system-ui, sans-serif" font-size="9" font-weight="700" letter-spacing="2" fill="#64748B">
      GLYPH INTERFACE // 165HZ
    </text>

    <!-- Asymmetrical Polygon Camera Island (ROG 8 Signature) -->
    <g transform="translate(108, 76)">
      <!-- Pentagon Angled Module -->
      <polygon points="0,0 160,0 178,70 145,150 0,150" fill="#1E222B" stroke="#475569" stroke-width="1.5"/>
      <polygon points="3,3 157,3 174,68 142,147 3,147" fill="#101217"/>

      <!-- Camera 1: 50MP Gimbal OIS (Top Left) -->
      <g transform="translate(48, 48)">
        <circle cx="0" cy="0" r="26" fill="#1E293B" stroke="#64748B" stroke-width="1.5"/>
        <circle cx="0" cy="0" r="21" fill="#020617"/>
        <circle cx="0" cy="0" r="19" fill="url(#rog-lens)"/>
        <circle cx="0" cy="0" r="10" stroke="#10B981" stroke-width="1.2" fill="#050811"/>
        <circle cx="-4" cy="-4" r="3" fill="#FFFFFF" fill-opacity="0.7"/>
      </g>

      <!-- Camera 2: 32MP Telephoto 3X (Bottom Left) -->
      <g transform="translate(48, 110)">
        <circle cx="0" cy="0" r="21" fill="#1E293B" stroke="#64748B" stroke-width="1.2"/>
        <circle cx="0" cy="0" r="17" fill="#020617"/>
        <circle cx="0" cy="0" r="15" fill="url(#rog-lens)"/>
        <circle cx="0" cy="0" r="7" stroke="#38BDF8" stroke-width="1" fill="#050811"/>
        <circle cx="-3" cy="-3" r="2.5" fill="#FFFFFF" fill-opacity="0.6"/>
      </g>

      <!-- Camera 3: 13MP Ultra-Wide (Right) -->
      <g transform="translate(115, 78)">
        <circle cx="0" cy="0" r="22" fill="#1E293B" stroke="#64748B" stroke-width="1.2"/>
        <circle cx="0" cy="0" r="18" fill="#020617"/>
        <circle cx="0" cy="0" r="16" fill="url(#rog-lens)"/>
        <circle cx="0" cy="0" r="8" stroke="#38BDF8" stroke-width="1" fill="#050811"/>
        <circle cx="-3" cy="-3" r="2.5" fill="#FFFFFF" fill-opacity="0.6"/>
      </g>

      <!-- LED Flash -->
      <rect x="110" y="22" width="16" height="10" rx="3" fill="#FEF08A" stroke="#CA8A04" stroke-width="0.8"/>
    </g>

    <!-- AniMe Vision Matrix ROG Fearless Eye Logo -->
    <g transform="translate(250, 520) scale(1.1)">
      <!-- Stylized ROG Eye with Cyan/Green Glow -->
      <path d="M-45 -18 L 10 -35 L 42 -12 L 32 -4 L 8 -18 L -30 -6 Z" fill="#10B981" opacity="0.9" filter="drop-shadow(0 0 8px #10B981)"/>
      <path d="M-38 5 L 8 26 L 45 4 L 38 15 L 8 36 L -32 15 Z" fill="#38BDF8" opacity="0.9" filter="drop-shadow(0 0 8px #38BDF8)"/>
      <polygon points="-12,-4 18,-14 28,-4 0,6" fill="#FFFFFF"/>
    </g>

    <text x="250" y="660" text-anchor="middle" font-family="'Space Grotesk', system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="4" fill="#94A3B8">
      REPUBLIC OF GAMERS
    </text>
  </g>
</svg>
