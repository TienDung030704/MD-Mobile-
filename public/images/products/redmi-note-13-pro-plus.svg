<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 750" fill="none">
  <defs>
    <!-- Aurora Purple Gradients -->
    <linearGradient id="aurora-frame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <linearGradient id="aurora-back" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E9D5FF"/>
      <stop offset="35%" stop-color="#C4B5FD"/>
      <stop offset="70%" stop-color="#BAE6FD"/>
      <stop offset="100%" stop-color="#DDD6FE"/>
    </linearGradient>

    <radialGradient id="redmi-lens" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.3"/>
      <stop offset="40%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#050314"/>
    </radialGradient>

    <filter id="redmi-shadow" x="-15%" y="-10%" width="130%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="26" stdDeviation="22" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#8B5CF6" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#redmi-shadow)">
    <!-- Right Buttons -->
    <rect x="420" y="220" width="4.5" height="100" rx="2" fill="#A855F7" />
    <rect x="420" y="340" width="4.5" height="50" rx="2" fill="#A855F7" />

    <!-- 3D Curved Body -->
    <rect x="80" y="45" width="340" height="660" rx="42" fill="url(#aurora-frame)" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="1.5"/>
    <rect x="83" y="48" width="334" height="654" rx="39" fill="url(#aurora-back)"/>

    <!-- Dynamic Color Blocks (Redmi Note 13 Pro+ iconic back split) -->
    <path d="M83 48 L 417 48 L 417 250 L 83 250 Z" fill="#DDD6FE" fill-opacity="0.5"/>
    <path d="M250 48 L 417 48 L 417 180 L 250 180 Z" fill="#BAE6FD" fill-opacity="0.45"/>

    <!-- Light Sheen -->
    <path d="M85 85 C 85 60, 105 50, 130 50 L 370 50 L 415 250 L 85 450 Z" fill="#FFFFFF" fill-opacity="0.25"/>

    <!-- Floating Camera 1: 200MP OIS (Top Left) -->
    <g transform="translate(142, 115)">
      <circle cx="0" cy="0" r="30" fill="#FFFFFF" stroke="#C084FC" stroke-width="2"/>
      <circle cx="0" cy="0" r="26" fill="#18152E"/>
      <circle cx="0" cy="0" r="22" fill="url(#redmi-lens)"/>
      <circle cx="0" cy="0" r="11" stroke="#818CF8" stroke-width="1.2" fill="#03020D"/>
      <circle cx="-5" cy="-5" r="4" fill="#FFFFFF" fill-opacity="0.7"/>
    </g>

    <!-- Floating Camera 2: 8MP Ultra-Wide (Bottom Left) -->
    <g transform="translate(142, 185)">
      <circle cx="0" cy="0" r="24" fill="#FFFFFF" stroke="#C084FC" stroke-width="1.8"/>
      <circle cx="0" cy="0" r="20" fill="#18152E"/>
      <circle cx="0" cy="0" r="17" fill="url(#redmi-lens)"/>
      <circle cx="0" cy="0" r="8" stroke="#818CF8" stroke-width="1" fill="#03020D"/>
      <circle cx="-3" cy="-4" r="3" fill="#FFFFFF" fill-opacity="0.6"/>
    </g>

    <!-- Floating Camera 3: 2MP Macro (Right) -->
    <g transform="translate(205, 150)">
      <circle cx="0" cy="0" r="16" fill="#FFFFFF" stroke="#C084FC" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="13" fill="#18152E"/>
      <circle cx="0" cy="0" r="10" fill="url(#redmi-lens)"/>
      <circle cx="-2" cy="-2" r="2" fill="#FFFFFF" fill-opacity="0.6"/>
    </g>

    <!-- Two-Tone Flash Strip -->
    <rect x="235" y="105" width="45" height="14" rx="7" fill="#FEF08A" stroke="#CA8A04" stroke-width="0.8"/>
    <circle cx="245" cy="112" r="3.5" fill="#FFFFFF"/>
    <circle cx="265" cy="112" r="3.5" fill="#FBBF24"/>

    <!-- 200MP OIS Label -->
    <text x="235" y="145" font-family="'Space Grotesk', system-ui, sans-serif" font-size="9" font-weight="700" letter-spacing="1" fill="#7C3AED">
      200MP OIS
    </text>

    <!-- Redmi Logo Bottom Left -->
    <text x="140" y="650" font-family="'Space Grotesk', system-ui, sans-serif" font-size="16" font-weight="800" letter-spacing="2" fill="#7C3AED">
      Redmi
    </text>
  </g>
</svg>
