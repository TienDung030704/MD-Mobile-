<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 750" fill="none">
  <defs>
    <!-- Fold Metal Gradients -->
    <linearGradient id="fold-frame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="50%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <linearGradient id="fold-hinge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="30%" stop-color="#94A3B8"/>
      <stop offset="60%" stop-color="#E2E8F0"/>
      <stop offset="90%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <linearGradient id="fold-back" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <radialGradient id="fold-lens-blue" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>

    <filter id="fold-shadow" x="-15%" y="-10%" width="130%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="26" stdDeviation="22" flood-color="#000000" flood-opacity="0.7"/>
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#7C3AED" flood-opacity="0.2"/>
    </filter>
  </defs>

  <g filter="url(#fold-shadow)">
    <!-- Right Button -->
    <rect x="408" y="220" width="4.5" height="110" rx="2" fill="#64748B" />

    <!-- Left Armored Armor Aluminum Hinge Strip -->
    <rect x="80" y="44" width="22" height="662" rx="6" fill="url(#fold-hinge)" stroke="#CBD5E1" stroke-width="0.8"/>
    <text x="91" y="380" transform="rotate(-90 91 380)" text-anchor="middle" font-family="'Space Grotesk', system-ui, sans-serif" font-size="8" font-weight="700" letter-spacing="3" fill="#FFFFFF" fill-opacity="0.45">
      SAMSUNG
    </text>

    <!-- Main Fold Body Chassis -->
    <rect x="100" y="44" width="308" height="662" rx="14" fill="url(#fold-frame)" stroke="#94A3B8" stroke-width="1.2"/>
    <rect x="103" y="47" width="302" height="656" rx="12" fill="url(#fold-back)"/>

    <!-- Light Sheen -->
    <path d="M103 80 L 350 47 L 405 47 L 103 450 Z" fill="#FFFFFF" fill-opacity="0.08"/>

    <!-- Pill-shaped Camera Island (Left Top) -->
    <g transform="translate(135, 80)">
      <!-- Pill Container Base -->
      <rect x="0" y="0" width="56" height="195" rx="28" fill="#1E293B" stroke="#64748B" stroke-width="1.5"/>
      <rect x="2" y="2" width="52" height="191" rx="26" fill="#0F172A" fill-opacity="0.8"/>

      <!-- Camera 1: 50MP Main OIS -->
      <g transform="translate(28, 36)">
        <circle cx="0" cy="0" r="21" fill="#334155" stroke="#94A3B8" stroke-width="1.5"/>
        <circle cx="0" cy="0" r="17" fill="#090D16"/>
        <circle cx="0" cy="0" r="15" fill="url(#fold-lens-blue)"/>
        <circle cx="0" cy="0" r="7" stroke="#38BDF8" stroke-width="1" fill="#020617"/>
        <circle cx="-3" cy="-3" r="2.5" fill="#FFFFFF" fill-opacity="0.7"/>
      </g>

      <!-- Camera 2: 12MP Ultra-Wide -->
      <g transform="translate(28, 97)">
        <circle cx="0" cy="0" r="21" fill="#334155" stroke="#94A3B8" stroke-width="1.5"/>
        <circle cx="0" cy="0" r="17" fill="#090D16"/>
        <circle cx="0" cy="0" r="15" fill="url(#fold-lens-blue)"/>
        <circle cx="0" cy="0" r="6" stroke="#60A5FA" stroke-width="1" fill="#020617"/>
        <circle cx="-3" cy="-3" r="2.5" fill="#FFFFFF" fill-opacity="0.6"/>
      </g>

      <!-- Camera 3: 10MP Telephoto 3X -->
      <g transform="translate(28, 158)">
        <circle cx="0" cy="0" r="21" fill="#334155" stroke="#94A3B8" stroke-width="1.5"/>
        <circle cx="0" cy="0" r="17" fill="#090D16"/>
        <circle cx="0" cy="0" r="15" fill="url(#fold-lens-blue)"/>
        <circle cx="0" cy="0" r="6" stroke="#60A5FA" stroke-width="1" fill="#020617"/>
        <circle cx="-3" cy="-3" r="2.5" fill="#FFFFFF" fill-opacity="0.6"/>
      </g>
    </g>

    <!-- LED Flash Beside Camera -->
    <circle cx="212" cy="116" r="8" fill="#FFFBEB" stroke="#94A3B8" stroke-width="1"/>
    <circle cx="212" cy="116" r="5" fill="#FACC15"/>

    <!-- Galaxy AI Floating Badge -->
    <rect x="250" y="80" width="85" height="24" rx="12" fill="#7C3AED" fill-opacity="0.18" stroke="#A78BFA" stroke-opacity="0.4" stroke-width="1"/>
    <text x="292" y="96" text-anchor="middle" font-family="'Space Grotesk', system-ui, sans-serif" font-size="10" font-weight="700" fill="#C4B5FD">
      ✦ Galaxy AI
    </text>

    <!-- Samsung Wordmark Bottom -->
    <text x="254" y="660" text-anchor="middle" font-family="'Space Grotesk', system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="4" fill="#FFFFFF" fill-opacity="0.3">
      SAMSUNG
    </text>
  </g>
</svg>
