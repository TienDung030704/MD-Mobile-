<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 750" fill="none">
  <defs>
    <!-- Ceramic White Gradients -->
    <linearGradient id="ceramic-frame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="50%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <linearGradient id="ceramic-back" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#F8FAFC"/>
      <stop offset="80%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <!-- Leica Gold Ring -->
    <linearGradient id="leica-gold-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="35%" stop-color="#F59E0B"/>
      <stop offset="70%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <radialGradient id="camera-disk" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E232F"/>
      <stop offset="70%" stop-color="#0F1117"/>
      <stop offset="100%" stop-color="#05060A"/>
    </radialGradient>

    <radialGradient id="leica-lens" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.3"/>
      <stop offset="35%" stop-color="#1E293B"/>
      <stop offset="75%" stop-color="#090D16"/>
      <stop offset="100%" stop-color="#020306"/>
    </radialGradient>

    <filter id="xiaomi-shadow" x="-15%" y="-10%" width="130%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="28" stdDeviation="24" flood-color="#000000" flood-opacity="0.65"/>
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#EF4444" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#xiaomi-shadow)">
    <!-- Right Buttons -->
    <rect x="420" y="210" width="4.5" height="100" rx="2" fill="#94A3B8" />
    <rect x="420" y="335" width="4.5" height="50" rx="2" fill="#EF4444" stroke="#94A3B8" stroke-width="0.8"/>

    <!-- Rounded Curved Body -->
    <rect x="80" y="45" width="340" height="660" rx="46" fill="url(#ceramic-frame)" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="1.5"/>
    <rect x="83" y="48" width="334" height="654" rx="43" fill="url(#ceramic-back)"/>

    <!-- Light Sheen -->
    <path d="M85 85 C 85 60, 105 50, 130 50 L 370 50 C 395 50, 415 60, 415 85 L 415 250 L 85 450 Z" fill="#FFFFFF" fill-opacity="0.25"/>

    <!-- Xiaomi Wordmark at Bottom -->
    <text x="250" y="660" text-anchor="middle" font-family="'Space Grotesk', system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="3" fill="#64748B">
      XIAOMI
    </text>

    <!-- Giant Circular Camera Island (Co-engineered with Leica) -->
    <g transform="translate(250, 240)">
      <!-- Outer Stepped Deco Rim -->
      <circle cx="0" cy="0" r="142" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
      <!-- Knurled Gold Ring Accent -->
      <circle cx="0" cy="0" r="138" fill="url(#leica-gold-ring)" stroke="#B45309" stroke-width="1"/>
      <circle cx="0" cy="0" r="134" fill="#0A0D14" stroke="#1E293B" stroke-width="1"/>
      <circle cx="0" cy="0" r="128" fill="url(#camera-disk)"/>

      <!-- Leica Lens Marking Ring -->
      <circle cx="0" cy="0" r="115" stroke="#334155" stroke-width="1" stroke-dasharray="2 3" fill="none"/>

      <!-- Leica Red Dot Logo at Center Top -->
      <rect x="-24" y="-12" width="48" height="24" rx="6" fill="#EF4444" stroke="#B91C1C" stroke-width="1"/>
      <text x="0" y="4" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="900" font-style="italic" fill="#FFFFFF">
        Leica
      </text>

      <!-- Lens 1: Top Main 1-inch Sony LYT-900 f/1.63 - f/4.0 -->
      <g transform="translate(0, -65)">
        <circle cx="0" cy="0" r="30" fill="#1E293B" stroke="url(#leica-gold-ring)" stroke-width="1.5"/>
        <circle cx="0" cy="0" r="25" fill="url(#leica-lens)"/>
        <circle cx="0" cy="0" r="14" stroke="#38BDF8" stroke-width="1.5" fill="#020617"/>
        <circle cx="-5" cy="-5" r="4" fill="#FFFFFF" fill-opacity="0.75" filter="blur(0.5px)"/>
      </g>

      <!-- Lens 2: Left Ultra-Wide 50MP -->
      <g transform="translate(-65, 10)">
        <circle cx="0" cy="0" r="28" fill="#1E293B" stroke="#64748B" stroke-width="1.5"/>
        <circle cx="0" cy="0" r="23" fill="url(#leica-lens)"/>
        <circle cx="0" cy="0" r="11" stroke="#38BDF8" stroke-width="1" fill="#020617"/>
        <circle cx="-4" cy="-4" r="3.5" fill="#FFFFFF" fill-opacity="0.6"/>
      </g>

      <!-- Lens 3: Right Telephoto 50MP 3.2X Floating Lens -->
      <g transform="translate(65, 10)">
        <circle cx="0" cy="0" r="28" fill="#1E293B" stroke="#64748B" stroke-width="1.5"/>
        <circle cx="0" cy="0" r="23" fill="url(#leica-lens)"/>
        <circle cx="0" cy="0" r="11" stroke="#38BDF8" stroke-width="1" fill="#020617"/>
        <circle cx="-4" cy="-4" r="3.5" fill="#FFFFFF" fill-opacity="0.6"/>
      </g>

      <!-- Lens 4: Bottom Periscope Telephoto 50MP 5X -->
      <g transform="translate(0, 68)">
        <circle cx="0" cy="0" r="29" fill="#1E293B" stroke="#64748B" stroke-width="1.5"/>
        <circle cx="0" cy="0" r="24" fill="url(#leica-lens)"/>
        <!-- Square Periscope -->
        <rect x="-8" y="-8" width="16" height="16" rx="3" stroke="#475569" stroke-width="1.2" fill="#030712"/>
        <circle cx="-4" cy="-4" r="3" fill="#FFFFFF" fill-opacity="0.6"/>
      </g>

      <!-- Dual LED Flash -->
      <rect x="75" y="-55" width="22" height="12" rx="6" fill="#FEF08A" stroke="#CA8A04" stroke-width="0.8"/>
      <circle cx="81" cy="-49" r="3" fill="#FFFFFF" fill-opacity="0.8"/>
      <circle cx="91" cy="-49" r="3" fill="#FBBF24"/>
    </g>
  </g>
</svg>
